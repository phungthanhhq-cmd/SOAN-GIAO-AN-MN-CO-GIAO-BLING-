    <script>
      function xoaKhoangTrangGiaoAn(){
        const output = document.getElementById("output");
        if(!output) return;

        let html = output.innerHTML;

        html = html
          .replace(/&nbsp;/gi, " ")
          .replace(/<p[^>]*>\s*<\/p>/gi, "")
          .replace(/<div[^>]*>\s*<\/div>/gi, "")
          .replace(/<section[^>]*>\s*<\/section>/gi, "")
          .replace(/<article[^>]*>\s*<\/article>/gi, "")
          .replace(/\n+/g, " ")
          .replace(/\t+/g, " ")
          .replace(/ {2,}/g, " ");

        output.innerHTML = html;

        output.querySelectorAll("*").forEach(el=>{
          if (el.closest('table')) {
            return;
          }
          el.style.margin = "0";
          el.style.paddingTop = "0";
          el.style.paddingBottom = "0";
          el.style.lineHeight = "1.15";
          el.style.minHeight = "0";
          el.style.height = "auto";
          el.style.whiteSpace = "normal";

          if(el.textContent.trim() === ""){
            el.remove();
          }
        });
      }

      window.xoaKhoangTrangGiaoAn = xoaKhoangTrangGiaoAn;

      /* Tự động chạy sau khi tạo nội dung */
      setInterval(xoaKhoangTrangGiaoAn, 500);
    </script>

<script>
function lamSachHTML(html){
  return html
    .replace(/<br\s*\/?>/gi, "<br/>")
    .replace(/&nbsp;/gi, " ")
    .replace(/<p[^>]*>\s*<\/p>/gi, "")
    .replace(/<div[^>]*>\s*<\/div>/gi, "")
    .replace(/\n+/g, " ")
    .replace(/\t+/g, " ")
    .replace(/ {2,}/g, " ");
}

/* TÁCH GIÁO ÁN VÀ GỢI Ý */
function tachGiaoAnVaGoiY(){
  const output = document.getElementById("output");
  if(!output) return {giaoAn:"", goiY:""};

  let html = output.innerHTML;

  const tuKhoaGoiY = [
    "GỢI Ý",
    "PHẦN GỢI Ý",
    "Gợi ý",
    "Phần gợi ý",
    "LƯU Ý",
    "Lưu ý",
    "ĐỀ XUẤT",
    "Đề xuất"
  ];

  let viTriCat = -1;

  for(let key of tuKhoaGoiY){
    let index = html.indexOf(key);
    if(index !== -1){
      viTriCat = index;
      break;
    }
  }

  if(viTriCat === -1){
    return {
      giaoAn: lamSachHTML(html),
      goiY: ""
    };
  }

  let giaoAn = html.substring(0, viTriCat);
  let goiY = html.substring(viTriCat);

  return {
    giaoAn: lamSachHTML(giaoAn),
    goiY: lamSachHTML(goiY)
  };
}
